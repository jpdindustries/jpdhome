server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /jpdhome/ {
        rewrite ^/jpdhome/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /.well-known/ {
        allow all;
    }
}
